<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradientLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#f8fafc"/>
    </linearGradient>
    <linearGradient id="textGradientLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0891b2"/>
      <stop offset="50%" style="stop-color:#2563eb"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
    <linearGradient id="accentGradientLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0891b2;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:0.2"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" fill="url(#bgGradientLight)"/>

  <!-- Grid pattern -->
  <pattern id="gridLight" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(0,0,0,0.04)" stroke-width="1"/>
  </pattern>
  <rect width="1200" height="300" fill="url(#gridLight)"/>

  <!-- Glow effects -->
  <ellipse cx="300" cy="150" rx="200" ry="150" fill="#0891b2" opacity="0.05" filter="blur(60px)"/>
  <ellipse cx="900" cy="150" rx="200" ry="150" fill="#7c3aed" opacity="0.05" filter="blur(60px)"/>

  <!-- Logo cube -->
  <g transform="translate(150, 100)">
    <!-- Cube faces -->
    <path d="M50 0 L100 25 L100 75 L50 100 L0 75 L0 25 Z" fill="url(#accentGradientLight)" stroke="url(#textGradientLight)" stroke-width="2"/>
    <path d="M50 0 L100 25 L50 50 L0 25 Z" fill="rgba(8,145,178,0.1)" stroke="url(#textGradientLight)" stroke-width="1"/>
    <path d="M50 50 L100 25 L100 75 L50 100 Z" fill="rgba(37,99,235,0.1)" stroke="url(#textGradientLight)" stroke-width="1"/>
    <path d="M50 50 L0 25 L0 75 L50 100 Z" fill="rgba(124,58,237,0.1)" stroke="url(#textGradientLight)" stroke-width="1"/>
    <!-- Inner detail -->
    <circle cx="50" cy="50" r="15" fill="none" stroke="url(#textGradientLight)" stroke-width="1.5" opacity="0.6"/>
  </g>

  <!-- Main title -->
  <text x="280" y="140" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="700" fill="#1e293b">
    ARKA
  </text>
  <text x="470" y="140" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="300" fill="url(#textGradientLight)">
    Protocol
  </text>

  <!-- Tagline -->
  <text x="280" y="185" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#64748b" letter-spacing="0.1em">
    OPEN SOURCE COMPLIANCE ENGINE
  </text>

  <!-- Accent line -->
  <rect x="280" y="205" width="400" height="2" fill="url(#textGradientLight)" rx="1"/>

  <!-- Feature badges -->
  <g transform="translate(280, 230)">
    <rect x="0" y="0" width="100" height="28" rx="14" fill="rgba(8,145,178,0.1)" stroke="#0891b2" stroke-width="1" opacity="0.8"/>
    <text x="50" y="19" font-family="system-ui, sans-serif" font-size="12" fill="#0891b2" text-anchor="middle">Rule Engine</text>

    <rect x="115" y="0" width="100" height="28" rx="14" fill="rgba(37,99,235,0.1)" stroke="#2563eb" stroke-width="1" opacity="0.8"/>
    <text x="165" y="19" font-family="system-ui, sans-serif" font-size="12" fill="#2563eb" text-anchor="middle">Blockchain</text>

    <rect x="230" y="0" width="80" height="28" rx="14" fill="rgba(124,58,237,0.1)" stroke="#7c3aed" stroke-width="1" opacity="0.8"/>
    <text x="270" y="19" font-family="system-ui, sans-serif" font-size="12" fill="#7c3aed" text-anchor="middle">Plugins</text>

    <rect x="325" y="0" width="70" height="28" rx="14" fill="rgba(22,163,74,0.1)" stroke="#16a34a" stroke-width="1" opacity="0.8"/>
    <text x="360" y="19" font-family="system-ui, sans-serif" font-size="12" fill="#16a34a" text-anchor="middle">SDKs</text>
  </g>

  <!-- Decorative elements -->
  <circle cx="1050" cy="80" r="4" fill="#0891b2" opacity="0.5"/>
  <circle cx="1080" cy="120" r="3" fill="#2563eb" opacity="0.4"/>
  <circle cx="1020" cy="140" r="2" fill="#7c3aed" opacity="0.3"/>
  <circle cx="1100" cy="180" r="3" fill="#16a34a" opacity="0.4"/>
  <circle cx="1040" cy="220" r="2" fill="#d97706" opacity="0.3"/>
</svg>
